[versions]
agp = "9.4.1"
kotlin = "2.4.20"
composeBom = "2026.09.00"
androidxActivity = "1.13.0"
androidxLifecycle = "2.11.0"
coroutines = "1.11.0"
androidxTest = "1.7.0"
androidxTestJunit = "1.3.0"
junit = "6.1.3"
hilt = "2.60.1"
ksp = "2.3.12"
espresso = "3.7.0"

[libraries]
androidxTestRules = { module = "androidx.test:rules", version.ref = "androidxTest" }
