retrofit = { module = "com.squareup.retrofit2:retrofit", version = "3.0.0" }
retrofitSerialization = { module = "com.squareup.retrofit2:converter-kotlinx-serialization", version = "3.0.0" }
serializationJson = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version = "1.11.0" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version = "5.5.0" }
coilCompose = { module = "io.coil-kt.coil3:coil-compose", version = "3.6.3" }
coilOkhttp = { module = "io.coil-kt.coil3:coil-network-okhttp", version = "3.6.3" }
pagingCommon = { module = "androidx.paging:paging-common", version = "3.5.1" }
pagingRuntime = { module = "androidx.paging:paging-runtime", version = "3.5.1" }
pagingCompose = { module = "androidx.paging:paging-compose", version = "3.5.1" }
